<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LB Livewell — No fluff, no fads (visual snapshot)</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font-family: ui-sans-serif, system-ui, sans-serif; }

  <header>

  <p class="label">Mobile 390</p>
  <section class="phone"><img src="no-fluff/phone-full.jpg" alt="LB Livewell mobile full page" /></section>

  <section class="desk"><img src="no-fluff/desktop-full.jpg" alt="LB Livewell desktop full page" /></section>
